
<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let mesa of mesas" >
        <ion-button class="tables" id="open-modal-table">
          {{ mesa }}
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

<ion-modal id="example-modal" #modal trigger="open-modal-table">
  <ng-template>
    <div class="wrapper">
      <h1 class="title-invitation">Mesa 1</h1>
      <ion-list >
        <ion-item *ngFor="let guest of tableList">
          <p>{{ guest }}</p>
          <p>tipo 1</p>
          <ion-button>x</ion-button>
        </ion-item>
      </ion-list>

      <div class="guest-container">
        <ion-grid>
          <ion-row>
            <ion-col class="guest" size="3" *ngFor="let guest of BrideGuests">
              <ion-button (click)="adicionarPessoa(guest)">
                <ion-icon name="person"></ion-icon>
              </ion-button>
              <ion-label>{{ guest }}</ion-label>
            </ion-col>
        </ion-row>
        </ion-grid>
      </div>
      <div class="button-container">
        <ion-button class="send-button">Salvar</ion-button>
      </div>
    </div>
  </ng-template>
</ion-modal>

<ion-item lines="none" class="input-date">
  <ion-label position="stacked">Casamos em</ion-label>
  <ion-input 
    type="date" 
    (ionChange)="validateDate($event)"
    [value]="selectedDate"
    max="2757-12-31" 
    [min]="minDate"
  >
    <ion-icon slot="end" name="calendar" color="primary"></ion-icon>
  </ion-input>
</ion-item>
